<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Libération du Sucre</title>
<meta name="description" content="Une graine qui devient arbre en 90 jours sans sucre ajouté, un plan d'action en 21 étapes et un bilan du soir.">
<meta name="theme-color" content="#16233a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sucre">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
html { padding-top: env(safe-area-inset-top, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }
/* Layout : une colonne façon appli mobile, barre d'onglets en bas.
   Le ciel est la seule variable : JS recalcule ces jetons du bleu nuit au bleu ciel
   selon la croissance de la plante (accueil) ou le rang de l'étape (pages d'étape).
   Thème unique et volontaire. */
:root {
  --bg: #16233a;
  --fg: #eaf3fb;
  --muted: #a9bdd2;
  --line: #34496a;
  --surface: #1f2f49;
  --surface-2: #283b58;
  --accent: #a9d4f5;
  --on-accent: #11243b;
  --glow: #4d7aa8;
  --ok: #8fd0aa;
  --warn: #ecd08e;
  --bad: #eda593;
  --on-sem: #11243b;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --ease: cubic-bezier(.22,.8,.24,1);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100%;
  background-color: var(--bg);
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px));
  transition: background-color 1.4s var(--ease), color 1.4s var(--ease);
  overflow-x: hidden;
}
a { color: inherit; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

/* ── Ciel et soleil ── */
#sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
#sun {
  position: absolute; left: 50%; top: 0;
  width: 150vmin; height: 150vmin;
  border-radius: 50%;
  background: radial-gradient(circle, var(--glow) 0%, transparent 62%);
  transform: translate(-50%, 70vh) scale(.5);
  opacity: .12;
  transition: transform 1.8s var(--ease), opacity 1.8s var(--ease);
  filter: blur(8px);
}
#flash {
  position: fixed; inset: 0; pointer-events: none; z-index: 40;
  background: radial-gradient(circle at 50% 35%, rgba(240,248,255,.9) 0%, rgba(200,228,248,.45) 40%, transparent 75%);
  opacity: 0;
}
#flash.go { animation: flash 1.3s var(--ease); }
@keyframes flash { 0% { opacity: 0 } 18% { opacity: .6 } 100% { opacity: 0 } }

.app { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding-top: 20px; display: flex; flex-direction: column; gap: 18px; }

/* ── Typo ── */
.eyebrow { margin: 0; font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.015em; }
h1 { font-size: clamp(1.7rem, 7vw, 2.3rem); line-height: 1.08; font-weight: 700; }
h2 { font-size: 1.15rem; font-weight: 650; }
.brand { font-size: 1.05rem; font-weight: 700; letter-spacing: .01em; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
p { margin: 0; }

.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }

/* ── Plante ── */
.grow { text-align: center; padding: 4px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.plant { width: min(270px, 72vw); max-width: 100%; aspect-ratio: 1; }
.plant svg { width: 100%; height: 100%; display: block; overflow: visible; }
.stage {
  font-family: var(--f-display); font-weight: 800;
  font-size: clamp(2.6rem, 13vw, 3.6rem); line-height: .95; letter-spacing: -.035em;
  font-variation-settings: "opsz" 96;
}
.days { font-size: 1rem; }
.days b { font-family: var(--f-display); font-size: 1.35rem; }
.grow .sub { color: var(--muted); font-size: .92rem; max-width: 34ch; }
.next-mile { margin-top: 6px; width: min(320px, 100%); display: flex; flex-direction: column; gap: 6px; font-size: .84rem; color: var(--muted); }
.track { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.track > i { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width 1s var(--ease); }

/* ── Cartes ── */
.card {
  display: flex; flex-direction: column; gap: 6px;
  padding: 16px 18px; border-radius: 18px;
  background: var(--surface); border: 1px solid var(--line);
  text-decoration: none; transition: background-color 1.4s var(--ease), border-color 1.4s var(--ease), transform .2s;
}
a.card:active { transform: scale(.985); }
.card .k { font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.card .t { font-family: var(--f-display); font-size: 1.12rem; font-weight: 650; line-height: 1.25; }
.card .go { font-size: .88rem; color: var(--accent); font-weight: 700; }
.card.call { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.card.call .k, .card.call .go { color: var(--on-accent); opacity: .8; }

/* ── Lumière ── */
.light { display: flex; flex-direction: column; gap: 8px; }
.light-head { display: flex; justify-content: space-between; align-items: baseline; }
.light-head b { font-family: var(--f-display); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.rays { display: grid; grid-template-columns: repeat(21, 1fr); gap: 3px; }
.rays a, .rays span { display: block; height: 22px; border-radius: 4px; background: var(--line); opacity: .7; transition: background-color .6s, opacity .6s, box-shadow .6s; }
.rays .on { opacity: 1; }
.rays .here { outline: 2px solid var(--fg); outline-offset: 1px; }

/* ── Étapes de croissance ── */
.stages { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.stg { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; min-width: 0; color: var(--muted); }
.stg .ico { width: 100%; max-width: 50px; aspect-ratio: 1; border-radius: 14px; border: 1.5px dashed var(--line); padding: 3px; }
.stg .ico svg { width: 100%; height: 100%; display: block; opacity: .35; filter: grayscale(.8); }
.stg b { font-size: .68rem; line-height: 1.2; }
.stg span { font-size: .64rem; font-variant-numeric: tabular-nums; }
.stg.lit { color: var(--fg); }
.stg.lit .ico { border-style: solid; background: var(--surface); }
.stg.lit .ico svg { opacity: 1; filter: none; }
.stg.now .ico { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

.sos { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 99px; border: 1.5px solid var(--accent); text-decoration: none; font-weight: 700; }
.sos small { font-weight: 400; color: var(--muted); display: block; }

/* ── Parcours ── */
.phase { display: flex; flex-direction: column; gap: 4px; }
.phase-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 0 6px; }
.phase-h .when { font-size: .8rem; color: var(--muted); white-space: nowrap; }
.node {
  position: relative; display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 14px;
  padding: 10px 0; text-decoration: none;
}
.node::before { content: ""; position: absolute; left: 21px; top: -8px; bottom: -8px; width: 2px; background: var(--line); z-index: -1; }
.node.first::before { top: 50%; }
.node.last::before { bottom: 50%; }
.dot {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--f-display); font-weight: 700; font-size: .95rem;
  border: 1.5px solid var(--line); background: var(--bg); color: var(--muted);
  transition: background-color .8s, box-shadow .8s, color .8s;
}
.node.done .dot { border: none; color: #11243b; }
.node .nt { font-weight: 700; line-height: 1.3; min-width: 0; }
.node .ns { font-size: .8rem; color: var(--muted); }
.node.done .nt { color: var(--fg); }
.node .chev { color: var(--muted); }

/* ── Page étape ── */
.crumb { display: flex; justify-content: space-between; align-items: center; font-size: .9rem; }
.crumb a { text-decoration: none; font-weight: 700; padding: 6px 0; }
.stepno { font-family: var(--f-display); font-weight: 800; font-size: clamp(4rem, 22vw, 6rem); line-height: .85; letter-spacing: -.05em; font-variant-numeric: tabular-nums; color: var(--accent); }
.tag { align-self: flex-start; font-size: .76rem; font-weight: 700; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.detail { font-size: 1.04rem; max-width: 62ch; display: flex; flex-direction: column; gap: 10px; }
.detail ul { margin: 6px 0 0; padding-left: 1.1rem; display: flex; flex-direction: column; gap: 8px; }
.detail strong { font-weight: 700; }
.detail em { font-style: italic; }
.lux { display: flex; justify-content: space-between; font-size: .84rem; color: var(--muted); }
.primary {
  appearance: none; border: none; cursor: pointer;
  padding: 16px 20px; border-radius: 16px; font-weight: 700; font-size: 1.02rem;
  background: var(--accent); color: var(--on-accent);
  transition: transform .15s, background-color 1.4s, color 1.4s;
}
.primary:active { transform: scale(.98); }
.ghost { appearance: none; cursor: pointer; padding: 14px 18px; border-radius: 16px; font-weight: 700; background: transparent; border: 1.5px solid var(--line); }
.donebadge { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.donebadge b { color: var(--accent); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pager a { text-decoration: none; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); font-size: .88rem; min-width: 0; }
.pager a span { display: block; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pager a.nx { text-align: right; }
.pager .empty { visibility: hidden; }

/* ── Bilan ── */
form { display: flex; flex-direction: column; gap: 22px; }
fieldset { border: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
legend { font-family: var(--f-display); font-weight: 650; font-size: 1.08rem; padding: 0; margin-bottom: 10px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opt { cursor: pointer; display: block; }
.opt > span {
  display: flex; flex-direction: column; gap: 2px;
  padding: 14px 16px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--surface);
  transition: border-color .2s, background-color .2s;
}
.opt > span b { font-size: 1rem; }
.opt > span small { color: var(--muted); font-size: .84rem; }
.opt input:checked + span { border-color: var(--accent); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--accent); }
.opt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.results { display: flex; flex-direction: column; gap: 8px; }
.res-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; vertical-align: 1px; }
.moods { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.moods .opt > span { align-items: center; text-align: center; padding: 12px 4px; gap: 8px; }
.moods .orb { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); }
.moods small { font-size: .74rem !important; line-height: 1.2; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips .opt > span { padding: 9px 14px; border-radius: 99px; font-weight: 700; font-size: .9rem; }
textarea { width: 100%; min-height: 96px; resize: vertical; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); }
.after { padding: 18px; border-radius: 18px; background: var(--surface-2); border: 1px solid var(--accent); display: flex; flex-direction: column; gap: 8px; }
.after a { color: var(--accent); font-weight: 700; }

/* ── Journal ── */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { padding: 14px 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile b { font-family: var(--f-display); font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; }
.tile span { font-size: .76rem; color: var(--muted); line-height: 1.25; }
.cal { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
.cal div { aspect-ratio: 1; max-width: 100%; border-radius: 7px; border: 1px solid var(--line); display: grid; place-items: center; font-size: .68rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.cal .r-reussi { background: var(--ok); color: var(--on-sem); border-color: transparent; }
.cal .r-ecart { background: var(--warn); color: var(--on-sem); border-color: transparent; }
.cal .r-craque { background: var(--bad); color: var(--on-sem); border-color: transparent; }
.gchart svg { width: 100%; height: auto; display: block; }
.cal .today { outline: 2px solid var(--fg); outline-offset: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .8rem; color: var(--muted); }
.chart { display: grid; grid-template-columns: auto 1fr; gap: 8px; }
.chart .yax { display: flex; flex-direction: column; justify-content: space-between; font-size: .7rem; color: var(--muted); padding-bottom: 18px; text-align: right; }
.bars { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; align-items: end; height: 130px; border-bottom: 1px solid var(--line); background-image: linear-gradient(var(--line) 1px, transparent 1px); background-size: 100% 25%; position: relative; }
.bars div { border-radius: 5px 5px 2px 2px; background: var(--accent); min-height: 0; }
.bars div.none { background: transparent; }
.xax { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; font-size: .64rem; color: var(--muted); text-align: center; margin-top: 4px; }
.trig { display: flex; flex-direction: column; gap: 8px; }
.trig-row { display: grid; grid-template-columns: 7.5rem 1fr 2rem; gap: 10px; align-items: center; font-size: .88rem; }
.trig-row .track { height: 8px; }
.trig-row .num { text-align: right; color: var(--muted); }
.entries { display: flex; flex-direction: column; gap: 10px; }
.entry { padding: 14px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.entry-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.entry-h b { text-transform: capitalize; }
.chip { display: inline-flex; align-items: center; font-size: .78rem; font-weight: 700; padding: 3px 10px; border-radius: 99px; }
.chip.reussi { background: var(--ok); color: var(--on-sem); }
.chip.ecart { background: var(--warn); color: var(--on-sem); }
.chip.craque { background: var(--bad); color: var(--on-sem); }
.entry .meta { font-size: .86rem; color: var(--muted); }
.entry .note { font-style: italic; overflow-wrap: anywhere; }
.entry button { align-self: flex-start; background: none; border: none; padding: 0; color: var(--accent); font-weight: 700; cursor: pointer; font-size: .86rem; }
.settings { display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: 18px; border: 1px solid var(--line); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
input[type="date"] { padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); min-width: 0; }
.empty-state { padding: 22px 18px; border-radius: 18px; border: 1.5px dashed var(--line); color: var(--muted); display: flex; flex-direction: column; gap: 10px; }
.empty-state a { color: var(--accent); font-weight: 700; }
.section { display: flex; flex-direction: column; gap: 12px; }

/* ── Onglets ── */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  transition: background-color 1.4s var(--ease);
}
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tabs a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; text-decoration: none; font-size: .72rem; font-weight: 700; color: var(--muted); border-radius: 12px; }
.tabs a svg { width: 24px; height: 24px; }
.tabs a[aria-current="page"] { color: var(--accent); }

.toast {
  position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 50;
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 99px;
  font-weight: 700; font-size: .9rem; max-width: calc(100vw - 32px); text-align: center;
  transition: transform .35s var(--ease), opacity .35s;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<div id="sky" aria-hidden="true"><div id="sun"></div></div>
<div id="flash" aria-hidden="true"></div>
<main class="app" id="app"></main>

<nav class="tabs" aria-label="Navigation">
  <div class="tabs-in">
    <a href="#aujourdhui" data-tab="aujourdhui">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
      Aujourd'hui
    </a>
    <a href="#parcours" data-tab="parcours">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h6a3.5 3.5 0 0 0 0-7h-4a3.5 3.5 0 0 1 0-7h6"/></svg>
      Parcours
    </a>
    <a href="#bilan" data-tab="bilan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
      Bilan du soir
    </a>
    <a href="#journal" data-tab="journal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3Z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg>
      Journal
    </a>
  </div>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ═══════════ Contenu du plan ═══════════ */
const PHASES = [
  { id: "p0", label: "Phase 0", name: "Préparation", when: "J-10 à J-1", light: "Avant l'aube", steps: [
    { id: "s01", title: "Auto-diagnostic : où en es-tu ?", tag: "Connaissance de soi",
      detail: `Réponds honnêtement à ces 5 questions, sur papier si possible :
<ul>
<li>Consommes-tu du sucre ajouté chaque jour, même sans faim ?</li>
<li>As-tu des envies irrésistibles en fin d'après-midi ou après un repas ?</li>
<li>Te sens-tu irritable ou fatigué si tu sautes une douceur ?</li>
<li>Manges-tu du sucre pour gérer un stress ou une émotion ?</li>
<li>As-tu déjà essayé d'arrêter sans succès durable ?</li>
</ul>` },
    { id: "s02", title: "Fixer une date d'arrêt précise : le Jour J", tag: "Engagement",

/* ═══════════ Dates ═══════════ */
const pad = n => String(n).padStart(2, "0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const todayKey = () => keyOf(new Date());
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const diffDays = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 864e5);
const fmt = (k, o) => parseKey(k).toLocaleDateString("fr-FR", o || { day: "numeric", month: "long" });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ═══════════ Données : base privée de l'utilisateur, sinon cet appareil ═══════════ */
const LS_V2 = "liberation_sucre_v2", LS_V1 = "sucre_progress_v1";
let S = { done: {}, start: null };   // étapes accomplies, Jour J
let C = {};                          // bilans par date
let db = null, progRef = null, ciCol = null;

function lsLoad() {
  try {
    const v = JSON.parse(localStorage.getItem(LS_V2) || "null");
    if (v) { S = { done: v.S?.done || {}, start: v.S?.start || null }; C = v.C || {}; return; }
    const old = JSON.parse(localStorage.getItem(LS_V1) || "null");
    if (old) for (const k in old) if (old[k] && BY_ID[k]) S.done[k] = "";
  } catch (e) {}
}
function lsSave() { try { localStorage.setItem(LS_V2, JSON.stringify({ S, C })); } catch (e) {} }
const clone = o => JSON.parse(JSON.stringify(o));

let chain = Promise.resolve();
function queueWrite(fn) {
  chain = chain.then(fn).catch(e => {
    console.warn(e);
    toast("Enregistré sur cet appareil uniquement");
  });
}
function saveProgress() { lsSave(); if (progRef) queueWrite(() => progRef.set(clone(S))); }
function saveCheckin(date, entry) {
  C[date] = entry; lsSave();
  if (ciCol) queueWrite(() => ciCol.doc(date).set(clone(entry)));
}

async function connect() {
  try {
    if (!window.claude || typeof window.claude.use !== "function") return;
    const [d, u] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!d || !u) return;
    const id = await u.id();
    if (!id) return;
    db = d;
    progRef = db.doc("data/users/" + id + "/progress");
    ciCol = progRef.collection("checkins");
    let firstP = true, firstC = true;
    progRef.onSnapshot(snap => {
      if (snap.exists) {
        const v = snap.data();
        S = { done: { ...(v.done || {}) }, start: v.start || null };
        lsSave(); render(true);
      } else if (firstP && !snap.metadata.fromCache && (Object.keys(S.done).length || S.start)) {
        queueWrite(() => progRef.set(clone(S)));   // reprise de la progression déjà cochée sur cet appareil
      }
      if (!snap.metadata.fromCache) firstP = false;
    }, () => {});
    ciCol.onSnapshot(snap => {
      if (snap.empty && firstC && Object.keys(C).length) {
        if (!snap.metadata.fromCache) { for (const k in C) { const e = clone(C[k]); queueWrite(() => ciCol.doc(k).set(e)); } firstC = false; }
        return;
      }
      const remote = {};
      snap.docs.forEach(doc => { remote[doc.id] = { ...doc.data() }; });
      C = remote; lsSave(); render(true);
      if (!snap.metadata.fromCache) firstC = false;
    }, () => {});
  } catch (e) { console.warn(e); }
}

/* ═══════════ Calculs ═══════════ */
/* Croissance : on rejoue les bilans dans l'ordre depuis le Jour J.
   Sans sucre → +1 jour · un produit sucré → la croissance s'arrête ce jour-là
   · craqué → retour au début de l'étape de croissance précédente. */
const stageOf = g => { let i = 0; STAGES.forEach((s, j) => { if (g >= s.at) i = j; }); return i; };
function growth() {
  const t = todayKey();
  const keys = Object.keys(C).sort().filter(k => k <= t && (!S.start || k >= S.start));
  let g = 0, best = 0;
  const log = [];
  for (const k of keys) {
    const r = C[k].result;
    const before = g;
    if (r === "reussi") g = Math.min(GOAL, g + 1);
    else if (r === "craque") { const si = stageOf(g); g = si > 0 ? STAGES[si - 1].at : 0; }
    best = Math.max(best, g);
    log.push({ k, r, g, before });
  }
  return { g, si: stageOf(g), best, log, last: log[log.length - 1] || null, total: keys.filter(k => C[k].result === "reussi").length };
}
const doneCount = () => STEPS.filter(s => s.id in S.done).length;
const homeLevel = () => 0.05 + 0.95 * growth().g / GOAL;

  return s + `<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(r * .3)}" fill="${PC.heart}"/>`;
};

  } else if (si === 1) {
    const S1 = stem(16 + 14 * t, 5, 3), [x, y] = S1.pt(1);

  } else if (si === 3) {

    if (t > .55) s += `<ellipse cx="${f1(x)}" cy="${f1(y - 4)}" rx="4" ry="6" fill="${PC.petal}"/>` + leaf(x, y, -120, 7, PC.leaf2) + leaf(x, y, -60, 7, PC.leaf2);
    else s += leaf(x, y, -130, 12, PC.leaf) + leaf(x, y, -50, 12, PC.leaf2);
  } else if (si === 4) {
    const S4 = stem(94 + 18 * t, 9, 4.5), [x, y] = S4.pt(1);

    [[.22, 22], [.42, 20], [.62, 17]].forEach(([u, L], i) => { const [a, b] = S4.pt(u); s += leaf(a, b, i % 2 ? -165 : -150, L, PC.leaf2) + leaf(a, b, i % 2 ? -28 : -15, L, PC.leaf); });
    if (t > .4) { const [a, b] = S4.pt(.5); s += `<path d="M${f1(a)} ${f1(b)}q16 -6 26 -22" stroke="${PC.stem}" stroke-width="3" fill="none" stroke-linecap="round"/>` + flower(a + 26, b - 24, 8 + 4 * t); }
    if (t > .75) { const [a, b] = S4.pt(.38); s += `<path d="M${f1(a)} ${f1(b)}q-16 -4 -24 -18" stroke="${PC.stem}" stroke-width="3" fill="none" stroke-linecap="round"/>` + flower(a - 24, b - 20, 9); }
    s += flower(x, y - 4, 12 + 6 * t);

  } else {
    let g6 = `<path d="M90 170 Q94 140 95 104 L105 104 Q106 140 110 170Z" fill="${PC.wood}"/><path d="M98 168 Q99 140 99 108" stroke="${PC.wood2}" stroke-width="2" fill="none"/>`;
    g6 += [["M97 120 Q80 106 66 96", 6], ["M103 116 Q120 104 134 94", 6], ["M100 108 Q100 90 100 70", 6]].map(([d, w]) => `<path d="${d}" stroke="${PC.wood}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`).join("");
    [[62, 88, 24], [138, 86, 24], [100, 58, 28], [78, 64, 24], [122, 62, 24], [100, 92, 24], [48, 104, 16], [152, 102, 16], [82, 98, 18], [118, 98, 18]]

/* ═══════════ Lumière ═══════════ */
const STOPS = [[0, "#16233a"], [.3, "#1d3252"], [.55, "#2a4c76"], [.7, "#3e6c9b"], [.8, "#7aaed6"], [.9, "#a6cdea"], [1, "#c6e4f6"]];
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const toHex = a => "#" + a.map(v => pad(Math.round(Math.max(0, Math.min(255, v))).toString(16))).join("");
const mix = (a, b, t) => toHex(hex(a).map((v, i) => v + (hex(b)[i] - v) * t));
function bgAt(L) {
  for (let i = 1; i < STOPS.length; i++) {
    const [p0, c0] = STOPS[i - 1], [p1, c1] = STOPS[i];
    if (L <= p1) return mix(c0, c1, (L - p0) / (p1 - p0));
  }
  return STOPS[STOPS.length - 1][1];
}
const lum = h => { const [r, g, b] = hex(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * r + .7152 * g + .0722 * b; };
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
const glowAt = L => mix("#4f7dab", "#dff0fb", Math.min(1, L));

function applyLight(L) {
  L = Math.max(0, Math.min(1, L));
  const bg = bgAt(L);
  const LIGHT = "#eaf3fb", DARK = "#11243b";
  const darkText = contrast(DARK, bg) > contrast(LIGHT, bg);
  const fg = darkText ? DARK : LIGHT;
  const r = document.documentElement.style;
  r.setProperty("--bg", bg);
  r.setProperty("--fg", fg);
  r.setProperty("--muted", mix(fg, bg, .28));
  r.setProperty("--line", mix(fg, bg, darkText ? .78 : .8));
  r.setProperty("--surface", mix(fg, bg, darkText ? .9 : .93));
  r.setProperty("--surface-2", mix(fg, bg, darkText ? .84 : .87));
  r.setProperty("--accent", darkText ? "#1f4f7a" : "#a9d4f5");
  r.setProperty("--on-accent", darkText ? "#eef6fc" : "#11243b");
  r.setProperty("--glow", darkText ? "#f3f9ff" : mix("#2d5583", "#9cc8ec", L));
  r.colorScheme = darkText ? "light" : "dark";
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content", bg);
  const sun = document.getElementById("sun");
  sun.style.transform = `translate(-50%, ${70 - L * 92}vh) scale(${.45 + L * .75})`;
  sun.style.opacity = (.12 + L * .38).toFixed(2);
}

function growthChart(log) {
  if (log.length < 2) return `<p class="muted">La courbe de croissance apparaîtra après deux bilans.</p>`;
  const W = 340, H = 170, L = 58, R = 10, T = 10, B = 24;
  const n = log.length;
  const x = i => L + (W - L - R) * i / (n - 1);
  const y = g => T + (H - T - B) * (1 - g / GOAL);
  let s = "";
  [[0, "Graine"], [30, "Fleur"], [60, "Arbuste"], [90, "Arbre"]].forEach(([g, name]) => {
    s += `<line x1="${L}" x2="${W - R}" y1="${f1(y(g))}" y2="${f1(y(g))}" style="stroke:var(--line)" stroke-width="1"/>`;
    s += `<text x="${L - 8}" y="${f1(y(g) + 4)}" text-anchor="end" style="fill:var(--muted)" font-size="11">${name}</text>`;
  });
  let d = `M${f1(x(0))} ${f1(y(log[0].g))}`;
  for (let i = 1; i < n; i++) d += `H${f1(x(i))}V${f1(y(log[i].g))}`;
  const rest = d.slice(d.indexOf("H"));
  s += `<path d="M${f1(x(0))} ${f1(y(0))}L${f1(x(0))} ${f1(y(log[0].g))}${rest}V${f1(y(0))}Z" style="fill:var(--accent)" opacity=".14"/>`;
  s += `<path d="${d}" style="stroke:var(--accent)" stroke-width="2.2" fill="none" stroke-linejoin="round"/>`;
  log.forEach((e, i) => { s += `<circle cx="${f1(x(i))}" cy="${f1(y(e.g))}" r="${n > 40 ? 2 : 3.2}" style="fill:var(--${e.r === "reussi" ? "ok" : e.r === "ecart" ? "warn" : "bad"});stroke:var(--bg)" stroke-width="1"/>`; });
  s += `<text x="${L}" y="${H - 6}" style="fill:var(--muted)" font-size="11">${fmt(log[0].k)}</text>`;
  s += `<text x="${W - R}" y="${H - 6}" text-anchor="end" style="fill:var(--muted)" font-size="11">${fmt(log[n - 1].k)}</text>`;
  return `<div class="gchart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe de croissance : ${log[n - 1].g} jours sur ${GOAL}">${s}</svg></div>`;
}

  <section class="section">
    <h2>Bilans</h2>
    <div class="entries">${keys.map(k => { const e = C[k]; return `<div class="entry">
      <div class="entry-h"><b>${fmt(k, { weekday: "long", day: "numeric", month: "long" })}</b><span class="chip ${e.result}">${RESULTS[e.result].label}</span></div>
      <p class="meta">${e.mood ? "Ressenti : " + MOODS[e.mood - 1] : ""}${e.crave != null ? " · Envies : " + CRAVES[e.crave].toLowerCase() : ""}${(e.triggers || []).length ? " · " + e.triggers.map(x => TRIGGERS[x]).join(", ") : ""}</p>
      ${e.note ? `<p class="note">« ${esc(e.note)} »</p>` : ""}
      <button type="button" data-edit="${k}">Modifier</button></div>`; }).join("")}</div>
  </section>`
  : `<div class="empty-state"><p>Votre premier bilan du soir apparaîtra ici, avec la courbe de croissance de votre plante, votre calendrier, l'évolution de votre ressenti et vos déclencheurs les plus fréquents.</p><a href="#bilan">Faire mon premier bilan →</a></div>`}
  <section class="settings">
    <h2>Réglages</h2>
    <div class="row"><label for="startEdit">Jour J</label><input type="date" id="startEdit" value="${S.start || ""}"><button class="ghost" type="button" id="startEditSave">Enregistrer</button></div>
    <div class="section" style="gap:8px">
      <p class="muted" style="font-size:.88rem">Vos bilans et votre plante sont enregistrés sur ce téléphone. Exportez une sauvegarde de temps en temps : elle permet aussi de passer sur un autre appareil.</p>
      <div class="row"><button class="ghost" type="button" id="exportData">Exporter mes données</button><label class="ghost" for="importFile" style="cursor:pointer">Importer une sauvegarde</label><input class="vh" type="file" id="importFile" accept="application/json,.json"></div>
    </div>
    <div class="row"><button class="ghost" type="button" id="resetSteps">${resetArmed ? "Confirmer : tout décocher" : "Décocher toutes les étapes du plan"}</button>${resetArmed ? `<button class="ghost" type="button" id="resetCancel">Annuler</button>` : ""}</div>
  </section>
  `;
}

/* ═══════════ Routage et rendu ═══════════ */
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  view = (BY_ID[h] || ["parcours", "bilan", "journal"].includes(h)) ? h : "aujourdhui";
  if (view !== "bilan") editDate = null;
  if (view !== "journal") resetArmed = false;
  render();
  window.scrollTo(0, 0);
}

function render(fromSync) {
  if (fromSync && view === "bilan") { applyLight(homeLevel()); return; }   // ne pas effacer une saisie en cours
  if (BY_ID[view]) {
    const s = BY_ID[view];
    applyLight(stepLevel(s.i) * (s.id in S.done ? 1 : .9));
    app.innerHTML = viewStep(view);
  } else {
    applyLight(homeLevel());
    app.innerHTML = view === "parcours" ? viewPath() : view === "bilan" ? viewCheckin() : view === "journal" ? viewJournal() : viewToday();
  }
  const tab = BY_ID[view] ? "parcours" : view;
  document.querySelectorAll(".tabs a").forEach(a => {
    if (a.dataset.tab === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  document.title = "Libération du Sucre";
  bind();
}

function bind() {
  const q = id => document.getElementById(id);
  q("startSave")?.addEventListener("click", () => {
    const v = q("startInput").value; if (!v) return;
    S.start = v; saveProgress(); render(); toast("Jour J fixé au " + fmt(v));
  });
  q("startEditSave")?.addEventListener("click", () => {
    const v = q("startEdit").value;
    S.start = v || null; saveProgress(); render(); toast(v ? "Jour J fixé au " + fmt(v) : "Jour J retiré");
  });
  q("resetSteps")?.addEventListener("click", () => {
    if (!resetArmed) { resetArmed = true; render(); return; }
    S.done = {}; resetArmed = false; saveProgress(); render(); toast("Toutes les étapes sont décochées");
  });
  q("exportData")?.addEventListener("click", () => {
    const data = JSON.stringify({ app: "liberation-sucre", version: 2, exportedAt: new Date().toISOString(), S, C }, null, 2);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], { type: "application/json" }));
    a.download = `liberation-sucre-${todayKey()}.json`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast("Sauvegarde exportée");
  });
  q("importFile")?.addEventListener("change", async e => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const v = JSON.parse(await file.text());
      if (!v || typeof v.C !== "object" || typeof v.S !== "object") throw new Error("format");
      const cleanC = {};
      for (const k in v.C) if (/^\d{4}-\d{2}-\d{2}$/.test(k) && v.C[k] && RESULTS[v.C[k].result]) cleanC[k] = v.C[k];
      const cleanDone = {};
      for (const k in (v.S.done || {})) if (BY_ID[k]) cleanDone[k] = String(v.S.done[k] || "");
      S = { done: cleanDone, start: /^\d{4}-\d{2}-\d{2}$/.test(v.S.start || "") ? v.S.start : null };
      C = cleanC;
      saveProgress();
      if (ciCol) for (const k in C) { const en = clone(C[k]); queueWrite(() => ciCol.doc(k).set(en)); }
      render(); toast(`Sauvegarde importée : ${Object.keys(C).length} bilans`);
    } catch (err) { toast("Ce fichier n'est pas une sauvegarde de Libération du Sucre"); }
  });
  q("resetCancel")?.addEventListener("click", () => { resetArmed = false; render(); });
  q("stepToggle")?.addEventListener("click", () => {
    const s = BY_ID[view];
    if (s.id in S.done) { delete S.done[s.id]; saveProgress(); render(); return; }
    S.done[s.id] = todayKey(); saveProgress();
    flash(); render();
    const phaseDone = s.phase.steps.every(x => x.id in S.done);
    toast(doneCount() === N ? "Les 21 étapes sont accomplies. Plein jour."
      : phaseDone ? `${s.phase.label} terminée : ${s.phase.light.toLowerCase()} atteint`
      : `Étape ${s.i + 1} accomplie · lumière ${Math.round(doneCount() / N * 100)} %`);
  });
  document.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => {
    editDate = b.dataset.edit;
    location.hash = "bilan";
  }));
  const form = q("ciForm");
  if (form) {
    form.querySelectorAll('input[name="date"]').forEach(r => r.addEventListener("change", () => { editDate = r.value; render(); }));
    form.addEventListener("submit", ev => {
      ev.preventDefault();
      const fd = new FormData(form);
      const result = fd.get("result");
      if (!result) { toast("Indiquez comment s'est passée votre journée"); q("r-reussi").focus(); return; }
      const date = fd.get("date") || todayKey();
      const entry = {
        result,
        mood: fd.get("mood") ? Number(fd.get("mood")) : null,
        crave: fd.get("crave") != null ? Number(fd.get("crave")) : null,
        triggers: fd.getAll("trig"),
        note: String(fd.get("note") || "").trim().slice(0, 2000),
        savedAt: new Date().toISOString(),
      };
      saveCheckin(date, entry);
      if (result === "reussi") flash();
      const after = q("after");
      after.className = "after"; after.innerHTML = afterMessage(result); after.hidden = false;
      form.querySelector('button[type="submit"]').textContent = "Mettre à jour mon bilan";
      editDate = date;
      after.scrollIntoView({ behavior: "smooth", block: "center" });
    });
  }
}

window.addEventListener("hashchange", route);
lsLoad();
route();
connect();
try { navigator.storage?.persist?.(); } catch (e) {}
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
